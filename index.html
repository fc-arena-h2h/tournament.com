    <script>
      // Suppress WebSocket errors in the preview environment where HMR is not supported
      if (window.location.hostname.includes('asia-southeast1.run.app')) {
        const originalWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          console.log('WebSocket connection suppressed for HMR compatibility.');
          return {
            url: url,
            readyState: 3, // CLOSED
            close: () => {},
            send: () => {},
            addEventListener: () => {},
            removeEventListener: () => {},
            onopen: null,
            onmessage: null,
            onerror: null,
            onclose: null
          };
        };
        window.WebSocket.prototype = originalWebSocket.prototype;
      }
    </script>
