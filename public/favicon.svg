<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shield_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="accent_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#34d399" />
    </linearGradient>
    <filter id="glow_filter">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <path
    d="M50 5L12 22V48C12 68 28 86 50 95C72 86 88 68 88 48V22L50 5Z"
    fill="url(#shield_grad)"
    stroke="#334155"
    strokeWidth="1"
  />
  
  <!-- Neon Accent Border -->
  <path
    d="M50 10L18 25V48C18 64 32 80 50 88C68 80 82 64 82 48V25L50 10Z"
    stroke="url(#accent_grad)"
    strokeWidth="2.5"
    strokeLinecap="round"
    strokeLinejoin="round"
    opacity="0.9"
    filter="url(#glow_filter)"
  />

  <!-- Professional Monogram 'FC' with Speed Lines -->
  <g transform="translate(25, 28) scale(0.5)">
    <!-- Stylized F -->
    <path
      d="M5 10H80V25H25V45H70V60H25V95H5V10Z"
      fill="white"
    />
    <!-- Stylized C -->
    <path
      d="M90 10H140V25H110V80H140V95H90V10Z"
      fill="#10b981"
    />
    <!-- Speed Bars -->
    <rect x="5" y="105" width="60" height="8" rx="4" fill="url(#accent_grad)" />
    <rect x="75" y="105" width="30" height="8" rx="4" fill="#fbbf24" />
    <rect x="115" y="105" width="20" height="8" rx="4" fill="white" opacity="0.5" />
  </g>
</svg>
